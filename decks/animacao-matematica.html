<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matemática — Animação de Partículas</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: radial-gradient(ellipse at center, #0d1b2a 0%, #000000 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            user-select: none;
        }
        #titulo {
            color: #fff;
            font-size: clamp(13px, 1.8vw, 20px);
            font-weight: 300;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            margin-bottom: 18px;
            opacity: 0.75;
        }
        #titulo span { color: #FFD700; font-weight: 900; }
        canvas {
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 0 60px rgba(255,215,0,0.08);
        }
        canvas:hover { box-shadow: 0 0 80px rgba(255,215,0,0.18); }
        #controles {
            margin-top: 22px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn {
            background: rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.85);
            border: 1px solid rgba(255,255,255,0.15);
            padding: 9px 22px;
            border-radius: 30px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            letter-spacing: 0.04em;
            transition: all 0.25s ease;
            backdrop-filter: blur(8px);
        }
        .btn:hover {
            background: rgba(255,215,0,0.18);
            border-color: #FFD700;
            color: #FFD700;
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(255,215,0,0.25);
        }
        #instrucao {
            margin-top: 14px;
            color: rgba(255,255,255,0.3);
            font-size: 11px;
            letter-spacing: 0.12em;
        }
        #estado-label {
            margin-top: 6px;
            color: #FFD700;
            font-size: 12px;
            letter-spacing: 0.1em;
            min-height: 16px;
            opacity: 0.8;
        }
    </style>
</head>
<body>

<div id="titulo">✏️ <span>Matemática</span> &nbsp;—&nbsp; Animação de Partículas</div>
<canvas id="canvas"></canvas>
<div id="estado-label">▶ Remontando a imagem...</div>
<div id="controles">
    <button class="btn" id="btnExplode">💥 Explodir</button>
    <button class="btn" id="btnMontagem">✨ Remontar</button>
    <button class="btn" id="btnWave">🌊 Wave</button>
    <button class="btn" id="btnLoop">⏸ Pausar Loop</button>
</div>
<div id="instrucao">Clique no canvas para interagir · Passe o mouse para atrair partículas</div>

// ================================================
// SETUP DO CANVAS
// ================================================
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const label = document.getElementById('estado-label');

const MAX_W = Math.min(window.innerWidth * 0.9, 700);
const MAX_H = window.innerHeight * 0.6;
const SCALE = Math.min(MAX_W / IMG_W, MAX_H / IMG_H, 1.5);

canvas.width  = Math.round(IMG_W * SCALE);
canvas.height = Math.round(IMG_H * SCALE);

// ================================================
// PARTÍCULAS
// ================================================
const particulas = pixelData.map((p, i) => ({
    tx: p.x * SCALE,
    ty: p.y * SCALE,
    x: Math.random() * canvas.width * 2 - canvas.width * 0.5,
    y: Math.random() * canvas.height * 2 - canvas.height * 0.5,
    vx: (Math.random() - 0.5) * 4,
    vy: (Math.random() - 0.5) * 4,
    r: p.r, g: p.g, b: p.b,
    radius: SCALE > 1.2 ? 1.8 : 1.3,
    delay: Math.floor(Math.random() * 60),
    wavePhase: Math.random() * Math.PI * 2,
    waveAmp: 8 + Math.random() * 14
}));

// ================================================
// ESTADO
// ================================================
let frame = 0;
let estado = 'montando';
let loopAtivo = true;
let loopTimer = null;
let mouseX = canvas.width / 2;
let mouseY = canvas.height / 2;
let mouseActive = false;

const SPRING  = 0.07;
const DAMPING = 0.72;

// ================================================
// FUNÇÕES DE ESTADO
// ================================================
function setEstado(s, texto) {
    estado = s;
    label.textContent = texto;
}

function montarImagem() {
    setEstado('montando', '✨ Remontando a imagem...');
}

function explodirImagem() {
    setEstado('explodindo', '💥 Explodindo!');
    const cx = canvas.width  / 2;
    const cy = canvas.height / 2;
    particulas.forEach(p => {
        const dx = p.x - cx + (Math.random()-0.5)*60;
        const dy = p.y - cy + (Math.random()-0.5)*60;
        const dist = Math.sqrt(dx*dx + dy*dy) || 1;
        const força = 12 + Math.random() * 14;
        p.vx = (dx / dist) * força;
        p.vy = (dy / dist) * força - Math.random() * 5;
    });
    setTimeout(() => { if (estado === 'explodindo') setEstado('dispersa', '✦ Dispersa'); }, 2000);
}

function waveImagem() {
    setEstado('wave', '🌊 Modo Wave');
}

// ================================================
// LOOP AUTOMÁTICO
// ================================================
function agendarLoop() {
    if (!loopAtivo) return;
    loopTimer = setTimeout(() => {
        montarImagem();
        setTimeout(() => {
            if (!loopAtivo) return;
            explodirImagem();
            agendarLoop();
        }, 4000);
    }, 1200);
}

// ================================================
// RENDER
// ================================================
function animar() {
    requestAnimationFrame(animar);
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // fundo sutil
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    frame++;

    particulas.forEach((p, i) => {
        if (frame < p.delay) return;

        if (estado === 'montando' || estado === 'formada') {
            // mola para o alvo
            const dx = p.tx - p.x;
            const dy = p.ty - p.y;
            p.vx += dx * SPRING;
            p.vy += dy * SPRING;
            if (Math.abs(dx) < 0.5 && Math.abs(dy) < 0.5 && frame > 120) {
                // chegou — marca como formada
            }
        } else if (estado === 'wave') {
            // oscila em torno do alvo
            const t = frame * 0.03;
            const tx = p.tx;
            const ty = p.ty + Math.sin(t + p.wavePhase) * p.waveAmp;
            p.vx += (tx - p.x) * 0.1;
            p.vy += (ty - p.y) * 0.1;
        } else {
            // explodindo / dispersa: gravidade
            p.vy += 0.18;
        }

        // atração do mouse
        if (mouseActive) {
            const dmx = mouseX - p.x;
            const dmy = mouseY - p.y;
            const dm = Math.sqrt(dmx*dmx + dmy*dmy);
            if (dm < 120) {
                p.vx += (dmx / dm) * 1.5;
                p.vy += (dmy / dm) * 1.5;
            }
        }

        p.vx *= DAMPING;
        p.vy *= DAMPING;
        p.x += p.vx;
        p.y += p.vy;

        // brilho pulsante sutil
        const brilho = 1 + 0.12 * Math.sin(frame * 0.04 + i * 0.08);
        const r = Math.min(255, Math.round(p.r * brilho));
        const g = Math.min(255, Math.round(p.g * brilho));
        const b = Math.min(255, Math.round(p.b * brilho));

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = 'rgb(' + r + ',' + g + ',' + b + ')';
        ctx.fill();
    });
}

// ================================================
// EVENTOS
// ================================================
document.getElementById('btnExplode').addEventListener('click', explodirImagem);
document.getElementById('btnMontagem').addEventListener('click', montarImagem);
document.getElementById('btnWave').addEventListener('click', waveImagem);
document.getElementById('btnLoop').addEventListener('click', () => {
    loopAtivo = !loopAtivo;
    document.getElementById('btnLoop').textContent = loopAtivo ? '⏸ Pausar Loop' : '▶ Iniciar Loop';
    if (loopAtivo) agendarLoop();
    else clearTimeout(loopTimer);
});

canvas.addEventListener('click', () => {
    if (estado === 'montando' || estado === 'formada' || estado === 'wave') {
        explodirImagem();
    } else {
        montarImagem();
    }
});

canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    mouseX = e.clientX - rect.left;
    mouseY = e.clientY - rect.top;
    mouseActive = true;
});
canvas.addEventListener('mouseleave', () => { mouseActive = false; });

// ================================================
// INICIA
// ================================================
animar();
montarImagem();
agendarLoop();
</script>
